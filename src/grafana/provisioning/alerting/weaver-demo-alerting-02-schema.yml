              editorMode: code
              expr: "histogram_quantile(0.95, sum by (le) (rate(demo_cart_add_item_latency_seconds_bucket[1m]))) * 1000 or on() vector(0)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: value
          - refId: threshold
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 500
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              expression: value
              intervalMs: 1000
              maxDataPoints: 43200
              refId: threshold
              type: threshold
        noDataState: OK
