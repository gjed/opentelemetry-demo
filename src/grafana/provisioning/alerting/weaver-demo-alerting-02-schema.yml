---
apiVersion: 1
groups:
  - orgId: 1
    name: Weaver02.10s
    folder: Weaver 02 - Generated from schema
    interval: 10s
    rules:
      - uid: w02-payment-transactions-rate
        title: "Payment transaction counter: under 1 per minute"
        condition: threshold
        data:
          - refId: value
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: webstore-metrics
            model:
              editorMode: code
              expr: "sum(rate(demo_payment_transactions_total[1m])) * 60 or on() vector(0)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: value
          - refId: threshold
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
              datasource:
                type: __expr__
                uid: __expr__
              expression: value
              intervalMs: 1000
              maxDataPoints: 43200
              refId: threshold
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          __dashboardUid__: weaver-02-schema
          __panelId__: "3"
          summary: "Payment transaction counter dropped under 1 per minute"
          description: "Fewer than 1 demo.payment.transactions events per minute in the last minute (payment service). Check the payment service and the services calling it."
        labels:
          service_name: "payment"
          service_namespace: opentelemetry-demo
          severity: critical
          source: weaver-codegen
        isPaused: false
        notification_settings:
          receiver: grafana-default-email
      - uid: w02-payment-transactions-mix
        title: "Payment transaction counter: fewer than 2 distinct values of currency code for the transaction"
        condition: threshold
        data:
          - refId: value
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: webstore-metrics
            model:
              editorMode: code
              expr: "count(sum by (demo_payment_currency) (rate(demo_payment_transactions_total{demo_payment_currency!=\"\"}[5m])) > 0) or on() vector(0)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: value
          - refId: threshold
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: lt
              datasource:
                type: __expr__
                uid: __expr__
              expression: value
              intervalMs: 1000
              maxDataPoints: 43200
              refId: threshold
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          __dashboardUid__: weaver-02-schema
          __panelId__: "3"
          summary: "Payment transaction counter seen for fewer than 2 distinct values of currency code for the transaction"
          description: "In the last 5 minutes demo.payment.transactions was recorded for fewer than 2 distinct values of demo.payment.currency (payment service). Part of the traffic is missing or is not labelled."
        labels:
          service_name: "payment"
          service_namespace: opentelemetry-demo
          severity: warning
          source: weaver-codegen
        isPaused: false
        notification_settings:
          receiver: grafana-default-email
      - uid: w02-cart-add-item-latency-p95
