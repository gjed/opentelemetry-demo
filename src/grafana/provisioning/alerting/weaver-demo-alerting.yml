---
apiVersion: 1
groups:
  - orgId: 1
    name: WeaverDemo.1m
    folder: Weaver - Observability by Design
    interval: 1m
    rules:
      - uid: weaver-app-ads-ad_requests
        title: "Weaver: Ad request counter Liveness"
        condition: threshold
        data:
          - refId: metric_rate
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: webstore-metrics
            model:
              editorMode: code
              expr: "sum(rate(app_ads_ad_requests_total[5m]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: metric_rate
          - refId: threshold
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - threshold
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: metric_rate
              intervalMs: 1000
              maxDataPoints: 43200
              refId: threshold
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        keepFiringFor: 2m
        annotations:
          summary: "Schema metric app.ads.ad_requests is being emitted"
          description: >-
            The metric app.ads.ad_requests (app_ads_ad_requests_total) is being
            emitted at a non-zero rate. If this alert goes to NoData, the metric
            has stopped being emitted — likely due to a metric rename or
            instrumentation drift.
        labels:
          service_name: "ad"
          service_namespace: opentelemetry-demo
          severity: warning
          source: weaver-codegen
        isPaused: false
        notification_settings:
          receiver: grafana-default-email
