---
apiVersion: 1
groups:
  - orgId: 1
    name: WeaverDemo.10s
    folder: Weaver - Observability by Design
    interval: 10s
    rules:
      - uid: weaver-demo-ad-requests
        title: "Weaver: demo.ad.requests stopped being emitted"
        condition: threshold
        data:
          - refId: absent
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: webstore-metrics
            model:
              editorMode: code
              expr: "absent_over_time(demo_ad_requests_total[15s])"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: absent
          - refId: threshold
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
              datasource:
                type: __expr__
                uid: __expr__
              expression: absent
              intervalMs: 1000
              maxDataPoints: 43200
              refId: threshold
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Schema metric demo.ad.requests is no longer emitted"
          description: >-
            No sample of demo.ad.requests (demo_ad_requests_total) was received
            in the last 15s. The metric was renamed or dropped: instrumentation
            drifted from the telemetry schema.
        labels:
          service_name: "ad"
          service_namespace: opentelemetry-demo
          severity: critical
          source: weaver-codegen
        isPaused: false
        notification_settings:
          receiver: grafana-default-email
