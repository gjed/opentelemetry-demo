file_format: definition/2
attributes:
  - key: demo.payment.currency
    type: string
    brief: Currency code for the transaction
    stability: stable
    examples: ["USD", "EUR", "GBP"]
    note: The currency in which the payment transaction was processed
  # LEGACY(baseline): old name of error.type, only used by demo-generate-baseline
  # - key: paymentError
  #   type: string
  #   brief: Payment error class (legacy name of error.type)
  #   stability: stable

metrics:
  - name: demo.payment.transactions
    brief: Payment transaction counter
    instrument: counter
    unit: "{transaction}"
    stability: stable
    requirement_level: recommended
    annotations:
      service: payment
      # Operational thresholds, consumed by weaver-templates/registry/grafana/alerting.yml.j2
      alert_min_per_min: 1
      # Attribute that marks a failed transaction, and the error-rate threshold in percent
      error_attribute: error.type
      alert_max_error_pct: 2
    attributes:
      - ref: demo.payment.currency
        requirement_level: required
      - ref: error.type
        requirement_level:
          conditionally_required: If the transaction failed.
      # LEGACY(baseline): the dashboard the team wrote reads the error label by its
      # old name. `make demo-generate-baseline` swaps the ref above for this one.
      #   - ref: paymentError
