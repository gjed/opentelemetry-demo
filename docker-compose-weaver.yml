# Docker Compose overlay for the Weaver Observability-by-Design scenario.
# Usage: docker compose -f docker-compose.yml -f docker-compose-weaver.yml up

networks:
  default:
    name: opentelemetry-demo
    driver: bridge

services:
  weaver:
    image: ${WEAVER_IMAGE}
    container_name: weaver
    command:
      - registry
      - live-check
      - --registry
      - /telemetry-schema
      - --input-source
      - otlp
      - --otlp-grpc-port
      - "4317"
      - --otlp-grpc-address
      - "0.0.0.0"
      - --inactivity-timeout
      - "0"
      - --skip-policies
      - --no-stats
      - --include-unreferenced
    ports:
      - "4320:4320"   # admin port (/stop endpoint)
    volumes:
      - ./telemetry-schema:/telemetry-schema:ro
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped
    depends_on:
      otel-collector:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  otel-collector:
    volumes:
      - ./src/otel-collector/otelcol-config-weaver.yml:/etc/otelcol-config-extras.yml

  # Services whose metrics appear on the generated dashboards/alerts export
  # every 5s (default 60s) so a renamed metric turns the alert red in seconds.
  ad:
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=5000
  cart:
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=5000
  checkout:
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=5000
  currency:
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=5000
  email:
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=5000
  payment:
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=5000
  recommendation:
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=5000
  shipping:
    environment:
      - OTEL_METRIC_EXPORT_INTERVAL=5000
